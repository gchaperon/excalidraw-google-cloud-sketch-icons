name: Checks

# Code quality checks for every pull request and every push to main. The jobs `lint`,
# `types` and `tests` are required status checks for merging into main (repository
# ruleset "Protect main").
#
# Security notes:
# - `pull_request`, never `pull_request_target`: code from forks runs without secrets and
#   with a read-only token.
# - No secrets are used. The tests run offline, except one render test that downloads
#   Excalidraw from esm.sh.
# - Actions are pinned to full commit SHAs. Python dependencies are pinned in uv.lock.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR or branch; a new push cancels the old run.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Ruff check
        run: uv run --locked ruff check --output-format github pipeline tests
      - name: Ruff format
        run: uv run --locked ruff format --check pipeline tests

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ty
        run: uv run --locked ty check --output-format github pipeline tests

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - name: pytest
        env:
          CHROME_BIN: google-chrome # preinstalled; the render test uses it
        run: uv run --locked pytest -ra
