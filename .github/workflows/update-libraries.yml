name: Update libraries

# Security notes:
# - Only `schedule` and `workflow_dispatch` triggers. Never add `pull_request_target` or
#   `workflow_run`: they run with this repository's secrets on code from forks.
# - The OpenRouter key is an *environment* secret (environment `openrouter`, deployments
#   restricted to `main`), and only the `build` job uses that environment. The job sets
#   `deployment: false`: the branch policy still applies, but no deployment record is created.
# - The `build` job has read-only access to the repository. The `release` job, which can
#   publish releases, has no access to the API key.
# - Generated files are never committed. The libraries and sources.lock.json (the state for
#   incremental builds) are published only as release files.
# - Actions are pinned to full commit SHAs. Python dependencies are pinned in uv.lock.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess every icon, even if the sources did not change"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-libraries
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: openrouter
      # Used only to scope the secret (branch policy: main). Nothing is deployed, so do not
      # create deployment records.
      deployment: false
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          # Ubuntu 24.04 blocks the user namespaces that Chrome's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Build changed icons
        id: build
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHROME_BIN: google-chrome
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: uv run --locked python -m pipeline.build $FORCE

      - name: Upload intermediate images and logs
        if: always() && hashFiles('build/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.run_id }}
          path: build/
          retention-days: 14

      - name: Upload release files
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  release:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          n=2
          while gh release view "$tag" >/dev/null 2>&1; do
            tag="v$(date -u +%Y.%m.%d).$n"; n=$((n + 1))
          done
          gh release create "$tag" dist/*.excalidrawlib dist/sources.lock.json \
            --title "$tag" --notes-file dist/notes.md --target "${{ github.sha }}"
