[project]
name = "excalidraw-google-cloud-sketch-icons"
version = "0.1.0"
description = "Pipeline that builds hand-drawn Excalidraw libraries from Google Cloud's official icons"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "requests>=2.31",
    "scikit-image>=0.24",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "syrupy>=7.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test names describe the tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # pipeline/ is not an installed package
addopts = ["--strict-markers"]
