[project]
name = "excalidraw-google-cloud-sketch-icons"
version = "0.1.0"
description = "Pipeline that builds hand-drawn Excalidraw libraries from Google Cloud's official icons"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "scikit-image>=0.24",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "syrupy>=7.0.1",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "ANN",     # flake8-annotations: every function is annotated (ty checks them)
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "RUF",     # ruff-specific rules
]

ignore = [
    "ANN401",  # Any is right for JSON data (Excalidraw elements, model answers)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]  # test names describe the tests; ty still checks them

[tool.ty.rules]
# The strictest setting: every rule is an error, including the ones that are off by
# default. New rules from a ty upgrade apply at once; ty is pinned in uv.lock, so an
# upgrade is always its own PR.
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # pipeline/ is not an installed package
addopts = ["--strict-markers"]
